body.default {
    background: radial-gradient(circle at top center, #a5f3fc 0%, #7dd3fc 35%, #38bdf8 70%, #0f172a 100%);
    color: #0f172a;
    background-attachment: fixed;
    background-size: cover;
}

/* CONTAINER */
.container {
    max-width: 600px;
    margin: 60px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* TITRE */
h2 {
    margin-bottom: 20px;
}

/* SEARCH */
.search-box {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    padding: 12px 15px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #1e40af;
}

/* RESULT */
#resultat {
    margin-top: 20px;
}

.card {
    background: rgba(255,255,255,0.9);
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    border: 1px solid #eee;
}

/* PANEL */
#historiquePanel {
    position: fixed;
    right: 0;
    top: 0;
    width: 320px;
    height: 100%;
    background: #0f172a;
    color: white;
    padding: 20px;
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    z-index: 999;
    box-shadow: -12px 0 28px rgba(0,0,0,0.35);
}

#historiqueBody {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
    margin-top: 15px;
}

#historiquePanel.open {
    transform: translateX(0);
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close-btn {
    background: transparent;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.history-item {
    padding: 8px;
    margin-top: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    cursor: pointer;
}

.history-item:hover {
    background: rgba(255,255,255,0.15);
}

.panel-section {
    margin-top: 20px;
}

#message {
    margin-top: 15px;
    padding: 12px 15px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.92);
    color: #f8fafc;
    display: inline-block;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
}

#message.visible {
    opacity: 1;
}

.fav-btn {
    margin-top: 10px;
    padding: 8px 12px;
    background: #f59e0b;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.fav-btn:hover {
    background: #d97706;

}

.prev-btn {
    margin-top: 10px;
    margin-left: 10px;
    padding: 8px 12px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.prev-btn:hover {
    background: #059669;
}

/* BTN HIST */
#btnHist {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #0f172a;
    color: white;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    font-size: 18px;
    border: none;
    cursor: pointer;
}

#btnHist:hover {
    background: #1e293b;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.close-result-btn {
    background: transparent;
    border: none;
    color: #666;
    font-size: 18px;
    cursor: pointer;
    padding: 5px;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close-result-btn:hover {
    background: #f0f0f0;
    color: #333;
}

</style>
</head>

<body class="default">

<div class="container">

    <h2>🌤️ App Météo</h2>

    <div class="search-box">
        <input type="text" id="ville" placeholder="Entrer une ville" onkeydown="handleKeyDown(event)">
        <button onclick="getMeteo()">🔍</button>
        <button onclick="getLocation()" title="Utiliser ma position">📍</button>
    </div>

    <div id="message"></div>
    <div id="resultat"></div>

</div>

<!-- HISTORIQUE BUTTON -->
<button id="btnHist" onclick="toggleHistorique()">📜</button>

<!-- PANEL -->
<div id="historiquePanel">

    <div class="panel-header">
        <h3>Historique</h3>
        <button class="close-btn" onclick="closeHistorique()">✖</button>
    </div>

    <div id="historiqueBody">
        <div class="panel-section">
            <h4>⭐ Favoris</h4>
            <div id="favorisList"></div>
        </div>

        <div class="panel-section">
            <h4>🕘 Historique</h4>
            <div id="historiqueList"></div>
        </div>
    </div>

</div>

<script>

let panelOpen = false;

window.addEventListener('load', () => {
    loadHistorique();
    loadFavoris();
});

/* MESSAGE */
function showMessage(text, duration = 2500) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.classList.add('visible');
    clearTimeout(msg.hideTimeout);
    msg.hideTimeout = setTimeout(() => msg.classList.remove('visible'), duration);
}

function handleKeyDown(event) {
    if (event.key === 'Enter') {
        getMeteo();
    }
}

/* 🌦️ CHANGE BACKGROUND */
function setWeatherBackground(description) {
    const body = document.body;
    body.classList.remove("sunny", "rainy", "cloudy", "default");

    description = description.toLowerCase();

    if (description.includes("rain")) {
        body.classList.add("rainy");
    }
    else if (description.includes("cloud")) {
        body.classList.add("cloudy");
    }
    else if (description.includes("clear")) {
        body.classList.add("sunny");
    }
    else {
        body.classList.add("default");
    }
}

/* ---------------- METEO ---------------- */
async function getMeteo() {
    const ville = document.getElementById("ville").value;

    if (!ville) {
        showMessage("Entre une ville.");
        return;
    }

    try {
        const res = await fetch(`http://127.0.0.1:8000/meteo/${ville}`);
        const data = await res.json();

        if (data.error) {
            document.getElementById("resultat").innerHTML = `<p>${data.error}</p>`;
            return;
        }

        setWeatherBackground(data.description);

        // Fetch air quality
        let airQualityHtml = '';
        try {
            const airRes = await fetch(`http://127.0.0.1:8000/air_quality/${data.lat}/${data.lon}`);
            const airData = await airRes.json();
            if (!airData.error) {
                airQualityHtml = `
                    <p>🌫️ Qualité de l'air : <strong>${airData.label}</strong> (AQI: ${airData.aqi})</p>
                    <details style="margin-top: 10px;">
                        <summary>Détails pollution</summary>
                        <small>
                            PM2.5: ${airData.components.pm2_5} µg/m³<br>
                            PM10: ${airData.components.pm10} µg/m³<br>
                            NO₂: ${airData.components.no2} µg/m³<br>
                            O₃: ${airData.components.o3} µg/m³
                        </small>
                    </details>
                `;
            }
        } catch (airErr) {
            console.log("Erreur qualité de l'air:", airErr);
        }

        document.getElementById("resultat").innerHTML = `
            <div class="card">
                <div class="card-header">
                    <h3>📍 ${data.ville}</h3>
                    <button onclick="clearResult()" class="close-result-btn" title="Fermer">✖</button>
                </div>
                <p>🌡️ Température : <strong>${data.temperature}°C</strong></p>
                <p>🌥️ ${data.description}</p>
                <p>💧 Humidité : ${data.humidite}%</p>
                <p>💨 Vent : ${data.vent} m/s</p>
                <p>🌅 Lever du soleil : <strong>${data.sunrise}</strong> | 🌇 Coucher : <strong>${data.sunset}</strong></p>
                ${airQualityHtml}
                <button onclick="addToFavoris('${data.ville}')" class="fav-btn">⭐ Ajouter aux favoris</button>
                <button onclick="getPrevisions('${data.ville}')" class="prev-btn">📅 Prévisions 5 jours</button>
            </div>
        `;

        loadHistorique();

    } catch (err) {
        document.getElementById("resultat").innerHTML = `<p>Erreur serveur</p>`;
    }
}

/* ---------------- GÉOLOCALISATION ---------------- */
function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            try {
                // Utilise les coordonnées pour obtenir la météo
                const res = await fetch(`http://127.0.0.1:8000/meteo/coords/${lat}/${lon}`);
                const data = await res.json();

                if (data.error) {
                    document.getElementById("resultat").innerHTML = `<p>${data.error}</p>`;
                    return;
                }

                setWeatherBackground(data.description);
                document.getElementById("ville").value = data.ville; // Remplit automatiquement la ville

                // Fetch air quality
                let airQualityHtml = '';
                try {
                    const airRes = await fetch(`http://127.0.0.1:8000/air_quality/${data.lat}/${data.lon}`);
                    const airData = await airRes.json();
                    if (!airData.error) {
                        airQualityHtml = `
                            <p>🌫️ Qualité de l'air : <strong>${airData.label}</strong> (AQI: ${airData.aqi})</p>
                            <details style="margin-top: 10px;">
                                <summary>Détails pollution</summary>
                                <small>
                                    PM2.5: ${airData.components.pm2_5} µg/m³<br>
                                    PM10: ${airData.components.pm10} µg/m³<br>
                                    NO₂: ${airData.components.no2} µg/m³<br>
                                    O₃: ${airData.components.o3} µg/m³
                                </small>
                            </details>
                        `;
                    }
                } catch (airErr) {
                    console.log("Erreur qualité de l'air:", airErr);
                }

                document.getElementById("resultat").innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h3>📍 ${data.ville} (votre position)</h3>
                            <button onclick="clearResult()" class="close-result-btn" title="Fermer">✖</button>
                        </div>
                        <p>🌡️ Température : <strong>${data.temperature}°C</strong></p>
                        <p>🌥️ ${data.description}</p>
                        <p>💧 Humidité : ${data.humidite}%</p>
                        <p>💨 Vent : ${data.vent} m/s</p>
                        <p>🌅 Lever du soleil : <strong>${data.sunrise}</strong> | 🌇 Coucher : <strong>${data.sunset}</strong></p>
                        ${airQualityHtml}
                        <button onclick="addToFavoris('${data.ville}')" class="fav-btn">⭐ Ajouter aux favoris</button>
                    </div>
                `;

                loadHistorique();

            } catch (err) {
                document.getElementById("resultat").innerHTML = `<p>Erreur géolocalisation</p>`;
            }
        });
    } else {
        showMessage("Géolocalisation non supportée par ce navigateur.");
    }
}

/* ---------------- HISTORIQUE ---------------- */
async function loadHistorique() {
    try {
        const res = await fetch("http://127.0.0.1:8000/historique");
        const data = await res.json();

        let html = "";

        if (data.historique.length === 0) {
            html = `<div class="history-item">Aucun historique pour l'instant.</div>`;
        } else {
            data.historique.slice().reverse().forEach(v => {
                html += `<div class="history-item">📍 ${v}</div>`;
            });
        }

        document.getElementById("historiqueList").innerHTML = html;
    } catch (err) {
        console.error("Erreur chargement historique:", err);
    }
}

/* ---------------- FAVORIS ---------------- */
async function addToFavoris(ville) {
    try {
        await fetch(`http://127.0.0.1:8000/favoris/${ville}`, { method: 'POST' });
        showMessage(`${ville} ajoutée aux favoris !`);
        loadFavoris();
    } catch (err) {
        console.error("Erreur ajout favoris:", err);
        showMessage("Impossible d'ajouter aux favoris.");
    }
}

async function loadFavoris() {
    try {
        const res = await fetch("http://127.0.0.1:8000/favoris");
        const data = await res.json();

        let favHtml = "";

        if (data.favoris.length === 0) {
            favHtml = `<div class="history-item">Aucun favori pour l'instant.</div>`;
        } else {
            data.favoris.forEach(v => {
                favHtml += `<div class="history-item" onclick="getMeteoVille('${v}')">⭐ ${v}</div>`;
            });
        }

        document.getElementById("favorisList").innerHTML = favHtml;
    } catch (err) {
        console.error("Erreur chargement favoris:", err);
    }
}

function getMeteoVille(ville) {
    document.getElementById("ville").value = ville;
    getMeteo();
}

/* ---------------- CLEAR RESULT ---------------- */
function clearResult() {
    document.getElementById("resultat").innerHTML = "";
    document.getElementById("ville").value = "";
    // Remettre le background par défaut
    document.body.className = "default";
}

/* ---------------- PRÉVISIONS ---------------- */
async function getPrevisions(ville) {
    try {
        const res = await fetch(`http://127.0.0.1:8000/previsions/${ville}`);
        const data = await res.json();

        if (data.error) {
            showMessage(`Erreur prévisions: ${data.error}`);
            return;
        }

        let html = `<div class="card">
            <h3>📅 Prévisions 5 jours - ${data.ville}</h3>`;

        data.previsions.forEach(prev => {
            html += `
                <div style="border-bottom: 1px solid #eee; padding: 8px 0;">
                    <strong>${new Date(prev.date).toLocaleDateString('fr-FR')}</strong><br>
                    🌡️ ${prev.temperature_moy}°C - ${prev.description}
                </div>`;
        });

        html += `</div>`;

        document.getElementById("resultat").innerHTML += html;

    } catch (err) {
        showMessage("Erreur chargement prévisions.");
    }
}

/* ---------------- PANEL ---------------- */
function toggleHistorique() {
    panelOpen = !panelOpen;
    document.getElementById("historiquePanel").classList.toggle("open");

    if (panelOpen) {
        loadFavoris();
        loadHistorique();
    }
}

function closeHistorique() {
    panelOpen = false;
    document.getElementById("historiquePanel").classList.remove("open");
}

</script>

</body>
</html>
